worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    upstream frontend {
        server frontend:3000;  # Node.js (Next.js) сервер
    }

    upstream backend {
        server backend:8080;     # ASP.NET Core сервер
    }

    server {
        listen 80;
        server_name localhost;

        # Все запросы к /api/ — на backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Запросы к /Images/ тоже на backend (если там хранится статика)
        location /Images/ {
            proxy_pass http://backend;
        }

        # Все остальные запросы — на frontend (Next.js)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}